<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Outer Golden Ring Gradient -->
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE082" />
      <stop offset="25%" stop-color="#D9A835" />
      <stop offset="50%" stop-color="#FFEFA8" />
      <stop offset="75%" stop-color="#B88019" />
      <stop offset="100%" stop-color="#E5BE54" />
    </linearGradient>

    <!-- Inner Golden Border Gradient -->
    <linearGradient id="goldInner" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D69B2A" />
      <stop offset="50%" stop-color="#FFF2B3" />
      <stop offset="100%" stop-color="#9C6B10" />
    </linearGradient>

    <!-- Ruby Jewel Gradient -->
    <linearGradient id="rubyGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4D6D" />
      <stop offset="50%" stop-color="#D70026" />
      <stop offset="100%" stop-color="#800010" />
    </linearGradient>

    <!-- SM Letter Gold/Bronze Gradient -->
    <linearGradient id="letterGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF0A0" />
      <stop offset="30%" stop-color="#E2B13C" />
      <stop offset="70%" stop-color="#BF7F1D" />
      <stop offset="100%" stop-color="#8A4E08" />
    </linearGradient>

    <!-- Paisley Pattern Fill for SM -->
    <pattern id="paisleyGold" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M14 2 C8 4 4 10 7 17 C9 22 17 22 19 16 C20 12 16 8 14 2 Z" fill="#99600F" opacity="0.45" />
      <circle cx="13" cy="14" r="3" fill="#FFEAA0" opacity="0.6" />
      <path d="M0 24 C4 22 7 25 5 28 C2 28 0 27 0 24 Z" fill="#99600F" opacity="0.4" />
      <path d="M24 0 C26 4 28 5 28 1 C28 0 26 0 24 0 Z" fill="#99600F" opacity="0.4" />
    </pattern>

    <!-- Red Glow Filter for Monogram and Crown -->
    <filter id="crimsonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#D70026" flood-opacity="0.85" />
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#700010" flood-opacity="0.9" />
    </filter>

    <!-- Badge Drop Shadow -->
    <filter id="badgeShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.35" />
    </filter>

    <!-- Path for curved text "SALVATION MAHUMANE VPN" -->
    <path id="textArc" d="M 80 375 A 190 190 0 0 0 420 375" />
  </defs>

  <!-- Outer Shadowed Circle -->
  <circle cx="250" cy="250" r="236" fill="none" filter="url(#badgeShadow)" />

  <!-- Outer Double Gold Rim -->
  <circle cx="250" cy="250" r="232" fill="#FFFFFF" stroke="url(#goldRim)" stroke-width="12" />
  <circle cx="250" cy="250" r="218" fill="none" stroke="url(#goldInner)" stroke-width="3" />

  <!-- Subtle Stardust Background Texture -->
  <g opacity="0.35">
    <circle cx="160" cy="120" r="1.5" fill="#D9A835" />
    <circle cx="340" cy="130" r="2" fill="#D9A835" />
    <circle cx="110" cy="270" r="1.5" fill="#D9A835" />
    <circle cx="390" cy="280" r="2" fill="#D9A835" />
    <circle cx="200" cy="380" r="1.5" fill="#D9A835" />
    <circle cx="300" cy="390" r="1.8" fill="#D9A835" />
    <polygon points="250,95 252,100 257,102 252,104 250,109 248,104 243,102 248,100" fill="#E2B13C" opacity="0.6" />
    <polygon points="140,210 141,213 144,214 141,215 140,218 139,215 136,214 139,213" fill="#E2B13C" opacity="0.5" />
    <polygon points="360,210 361,213 364,214 361,215 360,218 359,215 356,214 359,213" fill="#E2B13C" opacity="0.5" />
  </g>

  <!-- Royal Imperial Crown at Top Center -->
  <g id="royalCrown" filter="url(#crimsonGlow)">
    <!-- Crown Base Band -->
    <path d="M 175 168 Q 250 178 325 168 L 322 178 Q 250 188 178 178 Z" fill="url(#goldRim)" stroke="#7A5200" stroke-width="1" />
    
    <!-- Crown Main Body with 5 Peaks -->
    <path d="M 176 168 
             L 170 120 
             L 205 146 
             L 250 100 
             L 295 146 
             L 330 120 
             L 324 168 
             Q 250 182 176 168 Z" 
          fill="url(#letterGold)" 
          stroke="#5C3B00" 
          stroke-width="1.8" />
    
    <!-- Crown Inner Velvet Cushion Arc -->
    <path d="M 188 165 Q 250 148 312 165 Q 250 178 188 165 Z" fill="#900018" opacity="0.75" />

    <!-- Crown Jewels on Peaks (Rubies + Gold Pearls) -->
    <circle cx="170" cy="118" r="6" fill="url(#goldRim)" stroke="#5C3B00" stroke-width="1" />
    <circle cx="170" cy="118" r="3.5" fill="url(#rubyGlow)" />
    
    <circle cx="205" cy="144" r="5" fill="url(#goldRim)" stroke="#5C3B00" stroke-width="1" />
    <circle cx="205" cy="144" r="2.8" fill="url(#rubyGlow)" />
    
    <!-- Large Center Diamond/Ruby on Center Spire -->
    <circle cx="250" cy="98" r="8" fill="url(#goldRim)" stroke="#5C3B00" stroke-width="1.2" />
    <circle cx="250" cy="98" r="5" fill="url(#rubyGlow)" />
    <circle cx="248.5" cy="96" r="1.5" fill="#FFFFFF" opacity="0.9" />

    <circle cx="295" cy="144" r="5" fill="url(#goldRim)" stroke="#5C3B00" stroke-width="1" />
    <circle cx="295" cy="144" r="2.8" fill="url(#rubyGlow)" />

    <circle cx="330" cy="118" r="6" fill="url(#goldRim)" stroke="#5C3B00" stroke-width="1" />
    <circle cx="330" cy="118" r="3.5" fill="url(#rubyGlow)" />

    <!-- Ruby Gems Along Crown Base -->
    <circle cx="200" cy="173" r="3" fill="url(#rubyGlow)" />
    <circle cx="225" cy="175" r="3.5" fill="url(#rubyGlow)" />
    <ellipse cx="250" cy="176" rx="5" ry="3.5" fill="url(#rubyGlow)" />
    <circle cx="275" cy="175" r="3.5" fill="url(#rubyGlow)" />
    <circle cx="300" cy="173" r="3" fill="url(#rubyGlow)" />
  </g>

  <!-- Ornate Royal Initial "S" -->
  <g id="letterS" filter="url(#crimsonGlow)">
    <text x="145" y="325" 
          font-family="'Playfair Display', 'Times New Roman', Georgia, serif" 
          font-size="190" 
          font-weight="900" 
          font-style="normal"
          text-anchor="middle" 
          fill="url(#letterGold)" 
          stroke="#C4001F" 
          stroke-width="5"
          stroke-linejoin="round">S</text>
    <!-- Pattern Overlay for Paisley Texture -->
    <text x="145" y="325" 
          font-family="'Playfair Display', 'Times New Roman', Georgia, serif" 
          font-size="190" 
          font-weight="900" 
          text-anchor="middle" 
          fill="url(#paisleyGold)">S</text>
  </g>

  <!-- Ornate Royal Initial "M" -->
  <g id="letterM" filter="url(#crimsonGlow)">
    <text x="310" y="325" 
          font-family="'Playfair Display', 'Times New Roman', Georgia, serif" 
          font-size="190" 
          font-weight="900" 
          font-style="normal"
          text-anchor="middle" 
          fill="url(#letterGold)" 
          stroke="#C4001F" 
          stroke-width="5"
          stroke-linejoin="round">M</text>
    <!-- Pattern Overlay for Paisley Texture -->
    <text x="310" y="325" 
          font-family="'Playfair Display', 'Times New Roman', Georgia, serif" 
          font-size="190" 
          font-weight="900" 
          text-anchor="middle" 
          fill="url(#paisleyGold)">M</text>
  </g>

  <!-- Arched Text: SALVATION MAHUMANE VPN -->
  <g filter="url(#crimsonGlow)">
    <text font-family="'Cinzel', 'Playfair Display', 'Georgia', serif" 
          font-size="24" 
          font-weight="900" 
          letter-spacing="2"
          fill="url(#goldRim)"
          stroke="#8A0010"
          stroke-width="1.8"
          stroke-linejoin="round">
      <textPath href="#textArc" startOffset="50%" text-anchor="middle">
        SALVATION MAHUMANE VPN
      </textPath>
    </text>
  </g>
</svg>
